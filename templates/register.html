<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TradePro - Open Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'surface': '#0f131c',
              'surface-container': '#1c2028',
              'surface-container-high': '#262a33',
              'surface-container-lowest': '#0a0e16',
              'primary-container': '#00f5a0',
              'on-primary-container': '#003921',
              'primary-fixed-dim': '#00e293',
              'on-surface': '#dfe2ee',
              'on-surface-variant': '#b9cbbd',
              'outline': '#849588'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Background Glow -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-primary-container/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Registration Card -->
    <div class="w-full max-w-md bg-surface-container rounded-xl shadow-2xl p-8 relative z-10 border border-surface-container-high">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-container">
                <span class="material-symbols-outlined text-[24px]">person_add</span>
            </div>
            <div>
                <span class="text-xs text-outline font-mono uppercase tracking-wider">TRADEPRO // REGISTRATION</span>
                <h1 class="text-xl font-bold text-on-surface">Create New Account</h1>
            </div>
        </div>

        <!-- Notification Message (if any) -->
        {% if error %}
            <div class="mb-4 p-3 rounded bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                {{ error }}
            </div>
        {% endif %}

        <!-- Registration Form -->
        <form action="/register" method="POST" class="space-y-4">

            <!-- Full Name Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1" for="fullname">Full Name</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">badge</span>
                    <input type="text" id="fullname" name="fullname" required placeholder="John Doe"
                           class="w-full h-11 pl-10 pr-3 bg-surface-container-lowest text-on-surface rounded-lg border border-transparent focus:border-primary-container focus:outline-none text-sm transition-all"/>
                </div>
            </div>

            <!-- Email / Username Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1" for="username">Username / Email</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">alternate_email</span>
                    <input type="email" id="username" name="username" required placeholder="trader@tradepro.com"
                           class="w-full h-11 pl-10 pr-3 bg-surface-container-lowest text-on-surface rounded-lg border border-transparent focus:border-primary-container focus:outline-none text-sm transition-all"/>
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-semibold text-on-surface mb-1" for="password">Password</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock</span>
                    <input type="password" id="password" name="password" required placeholder="••••••••••••"
                           class="w-full h-11 pl-10 pr-3 bg-surface-container-lowest text-on-surface rounded-lg border border-transparent focus:border-primary-container focus:outline-none text-sm transition-all"/>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full h-12 mt-4 rounded-lg bg-primary-container text-on-primary-container font-bold flex items-center justify-center gap-2 shadow-[0_0_20px_-3px_rgba(0,245,160,0.35)] hover:opacity-95 transition-all">
                <span>Complete Registration</span>
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </form>

        <!-- Link back to Login -->
        <div class="text-center mt-6 pt-4 border-t border-surface-container-high text-xs text-on-surface-variant">
            Already have an account?
            <a href="/" class="text-primary-fixed-dim font-semibold hover:underline">Sign In</a>
        </div>
    </div>

</body>
</html>
