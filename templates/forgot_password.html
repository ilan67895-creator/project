<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שכחתי סיסמה</title>
</head>
<body>
    <h2>אחזור סיסמה - שלב 1</h2>

    <!-- במידה ושרת הלוגיקה החזיר שגיאה (למשל מייל לא קיים), נציג אותה באדום -->
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <!-- הטופס שולח בקשת POST לנתיב /forgot_password ב-Flask -->
    <form action="/forgot_password" method="POST">
        <label>:הכנס את כתובת המייל שלך</label><br>
        <!-- name="email" קריטי! זה השם שבאמצעותו פייתון קורא את הקלט -->
        <input type="email" name="email" placeholder="user@example.com" required><br><br>

        <button type="submit">שלח קוד לאיפוס</button>
    </form>

    <br>
    <!-- קישור חזרה לדף ההתחברות הראשי -->
    <a href="/">חזרה להתחברות</a>
</body>
</html>
