<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הזנת קוד איפוס</title>
</head>
<body>
    <h2>הזן את הקוד שקיבלת במייל - שלב 2</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <!-- הטופס שולח את הנתונים לנתיב /reset_password -->
    <form action="/reset_password" method="POST">
        <!-- שדה מוסתר ששומר את המייל שהועבר מדף הקודם -->
        <input type="hidden" name="email" value="{{ email }}">

        <label>:קוד בן 6 ספרות שנשלח למייל</label><br>
        <input type="text" name="code" maxlength="6" placeholder="123456" required><br><br>

        <label>:סיסמה חדשה</label><br>
        <input type="password" name="new_password" placeholder="הכנס סיסמה חדשה" required><br><br>

        <button type="submit">עדכן סיסמה</button>
    </form>
</body>
</html>
